# Development-only stack: every key, token and password below is public.
name: bugsink-grafana-plugin

x-bugsink-env: &bugsink-env
  SECRET_KEY: dev-only-secret-key-0123456789-0123456789-0123456789-abcdef
  DATABASE_URL: postgres://bugsink:bugsink@postgres:5432/bugsink
  BASE_URL: http://localhost:${BUGSINK_PORT:-8800}
  BEHIND_HTTPS_PROXY: "false"

services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: bugsink
      POSTGRES_PASSWORD: bugsink
      POSTGRES_DB: bugsink
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bugsink -d bugsink"]
      interval: 5s
      timeout: 5s
      retries: 20

  bugsink:
    image: bugsink/bugsink:${BUGSINK_VERSION:-2.6.3}
    environment:
      <<: *bugsink-env
      CREATE_SUPERUSER: admin@example.com:admin
      PORT: "8000"
    ports:
      - "127.0.0.1:${BUGSINK_PORT:-8800}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  bugsink-seed:
    image: bugsink/bugsink:${BUGSINK_VERSION:-2.6.3}
    restart: "no"
    environment:
      <<: *bugsink-env
    depends_on:
      bugsink:
        condition: service_healthy
    volumes:
      - ./docker/bugsink/seed.py:/seed.py:ro
    command: ["bugsink-manage", "shell", "-c", "exec(open('/seed.py').read())"]

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/tempo", "-health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  loki:
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_started
      bugsink-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health && wget -q -O /dev/null http://loki:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  sample-python:
    build: ./sample-apps/python
    environment:
      SENTRY_DSN: http://11111111111111111111111111111111@bugsink:8000/1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:${SAMPLE_PYTHON_PORT:-8810}:8000"
    depends_on:
      bugsink-seed:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
  tempo-data:
  loki-data:
