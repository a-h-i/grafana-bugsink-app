      - BearerAuth: []
      x-bugsink-required-capability: debug-files:upload
      summary: Upload sentry-cli file chunks
      description: |-
        This endpoint exists for sentry-cli sourcemap upload support. It accepts chunk files named by sha1 checksum. See the Bugsink sourcemaps documentation.

        Required capability: `debug-files:upload`.
      externalDocs:
        description: Bugsink sourcemaps documentation
        url: https://www.bugsink.com/docs/sourcemaps/
