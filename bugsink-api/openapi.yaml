                  auth:
                    type: object
                    additionalProperties: false
                    properties:
                      scopes:
                        type: array
                        items:
                          type: string
                    required:
                    - scopes
                  user:
                    nullable: true
                required:
                - version
                - auth
                - user
        '401':
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  message:
                    type: string
                  detail:
                    type: string
                  error:
                    type: string
