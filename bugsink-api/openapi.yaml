    SentryKeyQuery:
      type: apiKey
      in: query
      name: sentry_key
tags:
- name: events
- name: issue-comments
- name: issue-history
- name: issues
- name: projects
- name: releases
- name: teams
- name: Sentry-compatible API
  description: '`/api/0` and `/api/{project_pk}/` paths exist for Sentry-SDK / sentry-cli
    compatibility (as opposed to the `/api/canonical/` paths which are Bugsink-specific).'
- name: CSP reporting
  description: Native support for browser CSP violation reports emitted through the
    `report-uri` directive. Reports are translated into Bugsink events and processed
    through the normal ingest pipeline.
x-bugsink-capabilities:
  issues:read:
    description: View issues and their details.
    operations:
    - method: GET
      path: /api/canonical/0/issue-history/
      operationId: issue_history_list
    - method: GET
      path: /api/canonical/0/issues/
      operationId: issues_list
    - method: GET
      path: /api/canonical/0/issues/{id}/
      operationId: issues_retrieve
    - method: GET
      path: /api/canonical/0/issues/{id}/event-counts/
      operationId: issues_event_counts_retrieve
  events:read:
    description: View events, including event data and stacktraces.
    operations:
    - method: GET
      path: /api/canonical/0/events/
      operationId: events_list
    - method: GET
      path: /api/canonical/0/events/{id}/
      operationId: events_retrieve
    - method: GET
      path: /api/canonical/0/events/{id}/stacktrace/
      operationId: events_stacktrace_retrieve
    - method: GET
      path: /api/canonical/0/events/lookup/
      operationId: events_lookup_retrieve
    - method: GET
      path: /api/canonical/0/issues/{id}/grouping/
      operationId: issues_grouping_list
    - method: GET
      path: /api/canonical/0/issues/{id}/tags/
      operationId: issues_tags_list
  issues:comment:
    description: Add comments to issues.
    operations:
    - method: POST
      path: /api/canonical/0/issue-comments/
      operationId: issue_comments_create
  issues:triage:
    description: Resolve, reopen, mute, and unmute issues.
    operations:
    - method: POST
      path: /api/canonical/0/issues/{id}/mute/
      operationId: issues_mute_create
    - method: POST
      path: /api/canonical/0/issues/{id}/mute-for/
      operationId: issues_mute_for_create
    - method: POST
      path: /api/canonical/0/issues/{id}/mute-until/
      operationId: issues_mute_until_create
    - method: POST
      path: /api/canonical/0/issues/{id}/reopen/
      operationId: issues_reopen_create
    - method: POST
      path: /api/canonical/0/issues/{id}/resolve/
      operationId: issues_resolve_create
    - method: POST
      path: /api/canonical/0/issues/{id}/resolve-latest/
      operationId: issues_resolve_latest_create
    - method: POST
      path: /api/canonical/0/issues/{id}/resolve-next/
      operationId: issues_resolve_next_create
    - method: POST
      path: /api/canonical/0/issues/{id}/unmute/
      operationId: issues_unmute_create
  issues:delete:
    description: Delete issues.
    operations:
    - method: DELETE
      path: /api/canonical/0/issues/{id}/
      operationId: issues_destroy
  releases:read:
    description: View releases and their details.
    operations:
    - method: GET
      path: /api/canonical/0/releases/
      operationId: releases_list
    - method: GET
      path: /api/canonical/0/releases/{id}/
      operationId: releases_retrieve
  releases:create:
    description: Create releases.
    operations:
    - method: POST
      path: /api/canonical/0/releases/
      operationId: releases_create
  debug-files:upload:
    description: Upload and assemble debug files and artifact bundles.
    operations:
    - method: GET
      path: /api/0/
      operationId: sentry_compatible_api_root_retrieve
    - method: GET
      path: /api/0/organizations/{organization_slug}/chunk-upload/
      operationId: sentry_compatible_chunk_upload_settings_retrieve
    - method: POST
      path: /api/0/organizations/{organization_slug}/chunk-upload/
      operationId: sentry_compatible_chunk_upload_create
    - method: POST
      path: /api/0/organizations/{organization_slug}/artifactbundle/assemble/
      operationId: sentry_compatible_artifact_bundle_assemble_create
    - method: POST
      path: /api/0/projects/{organization_slug}/{project_slug}/files/difs/assemble/
      operationId: sentry_compatible_difs_assemble_create
  projects:read:
    description: View projects and their details.
    operations:
    - method: GET
      path: /api/canonical/0/projects/
      operationId: projects_list
    - method: GET
      path: /api/canonical/0/projects/{id}/
      operationId: projects_retrieve
    - method: GET
      path: /api/canonical/0/projects/{id}/event-counts/
      operationId: projects_event_counts_retrieve
  projects:manage:
    description: Create and update projects.
    operations:
    - method: POST
      path: /api/canonical/0/projects/
      operationId: projects_create
    - method: PATCH
      path: /api/canonical/0/projects/{id}/
      operationId: projects_partial_update
  teams:read:
    description: View teams and their details.
    operations:
    - method: GET
      path: /api/canonical/0/teams/
      operationId: teams_list
    - method: GET
      path: /api/canonical/0/teams/{id}/
      operationId: teams_retrieve
  teams:manage:
