      type: object
      properties:
        id:
          type: integer
          readOnly: true
        issue:
          type: string
          format: uuid
          readOnly: true
        project:
          type: integer
          readOnly: true
        triggering_event:
          type: string
          format: uuid
          description: Bugsink-internal
          readOnly: true
          nullable: true
        user:
          type: integer
          readOnly: true
          nullable: true
        user_display_name:
          type: string
          nullable: true
          readOnly: true
          description: Author's full name or username; null when no user is recorded.
        timestamp:
          type: string
          format: date-time
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        comment:
          type: string
          readOnly: true
        metadata:
          readOnly: true
          description: |-
            Details of the state change, depending on `kind`:

            - `resolved`: `resolved_unconditionally`, `resolve_by_next`, or `resolved_release`.
            - `muted`: `mute_unconditionally`, `mute_for` (`period_name`, `nr_of_periods`, `unmute_after`), or `mute_until` (`period_name`, `nr_of_periods`, `gte_threshold`).
            - `unmuted`: `{}` for manual unmuting; `mute_for` (`unmute_after`) or `mute_until` (`period`, `nr_of_periods`, `volume`) for automatic unmuting.
            - `next_materialized`: `actual_release` names the release that fulfilled resolve-by-next.

            Other kinds normally have `{}`. Release values are version strings; `unmute_after` is a UTC timestamp. Thresholds may be strings or numbers.
      required:
      - comment
      - id
      - issue
      - kind
      - metadata
      - project
      - timestamp
      - triggering_event
      - user
      - user_display_name
    UnmuteVolumeCondition:
      type: object
      properties:
        period:
          type: string
          description: Period unit, e.g. hour or day.
        nr_of_periods:
          type: integer
        volume:
          type: integer
      required:
      - nr_of_periods
      - period
      - volume
