openapi: 3.0.3
info:
  title: Bugsink
  version: 2.6.3
  description: Bugsink API Documentation
paths:
  /api/canonical/0/events/:
    get:
      operationId: events_list
      description: |-
        List events for an issue. The list response omits the full event `data` payload.

        Required capability: `events:read`.
      summary: List events
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: issue
        schema:
          type: string
        description: Filter events by issue UUID or friendly ID (required).
        required: true
      - in: query
        name: order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: 'Sort order of digest_order (default: desc).'
      - in: query
        name: q
        schema:
          type: string
        description: Search titles as plain text and filter tags with `key:value`;
          quote values containing spaces. Results must match the text and every tag
          filter.
      tags:
      - events
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventListList'
          description: ''
      x-bugsink-required-capability: events:read
  /api/canonical/0/events/{id}/:
    get:
      operationId: events_retrieve
      description: |-
        Retrieve an event by internal Bugsink event UUID. The detail response includes the full `data` payload.

        Required capability: `events:read`.
      summary: Retrieve an event
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          description: Bugsink-internal
        required: true
      tags:
      - events
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
      x-bugsink-required-capability: events:read
  /api/canonical/0/events/{id}/stacktrace/:
    get:
      operationId: events_stacktrace_retrieve
      description: |-
        Render the event's stacktrace (frames, source, locals) as Markdown-like text.

        Required capability: `events:read`.
      summary: Render an event stacktrace
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          description: Bugsink-internal
        required: true
      tags:
      - events
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            text/markdown:
              schema:
                type: string
              examples:
                Stacktrace:
                  value: Traceback (most rece...
          description: Stacktrace as Markdown
      x-bugsink-required-capability: events:read
  /api/canonical/0/events/lookup/:
    get:
      operationId: events_lookup_retrieve
      description: |-
        Retrieve an event by project and SDK-generated `event_id`, including the full `data` payload.

        Required capability: `events:read`.
      summary: Look up an event by SDK event ID
      parameters:
      - in: query
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: project
        schema:
          type: integer
        required: true
      tags:
      - events
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
      x-bugsink-required-capability: events:read
  /api/canonical/0/issue-comments/:
    post:
      operationId: issue_comments_create
      description: |-
        Add a comment to an issue. `issue` accepts an issue UUID or friendly ID.

        Required capability: `issues:comment`.
      summary: Create an issue comment
      tags:
      - issue-comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueComment'
        required: true
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueComment'
          description: ''
      x-bugsink-required-capability: issues:comment
  /api/canonical/0/issue-history/:
    get:
      operationId: issue_history_list
      description: |-
        List the turning points (state changes and comments) of an issue.

        Required capability: `issues:read`.
      summary: List issue history
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: issue
        schema:
          type: string
        description: Filter history by issue UUID or friendly ID (required).
        required: true
      - in: query
        name: order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: 'Sort order of timestamp (default: desc).'
      tags:
      - issue-history
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTurningPointList'
          description: ''
      x-bugsink-required-capability: issues:read
  /api/canonical/0/issues/:
    get:
      operationId: issues_list
      description: |-
        List issues across accessible projects, optionally limited to one project. Project-bound tokens stay within their project; personal tokens require accepted project membership (superusers can access all projects). Deleted issues and projects are excluded.

        Required capability: `issues:read`.
      summary: List issues
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: 'Default: asc for a single project, desc across projects.'
      - in: query
        name: project
        schema:
          type: integer
        description: Filter issues by project ID. Omit to list all projects accessible
          to the token.
      - in: query
        name: q
        schema:
          type: string
        description: Search titles as plain text and filter tags with `key:value`;
          quote values containing spaces. Results must match the text and every tag
          filter.
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - digest_order
          - digested_event_count
          - last_seen
        description: 'Default: digest_order for a single project, last_seen across
          projects. digest_order requires a single project.'
      - in: query
        name: state
        schema:
          type: string
          enum:
          - all
          - muted
          - open
          - resolved
          - unresolved
        description: 'Filter by issue state (default: all). Open means neither resolved
          nor muted.'
      tags:
      - issues
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIssueList'
          description: ''
      x-bugsink-required-capability: issues:read
  /api/canonical/0/issues/{id}/:
    get:
      operationId: issues_retrieve
      description: |-
        Retrieve an issue by issue UUID or friendly ID.

        Required capability: `issues:read`.
      summary: Retrieve an issue
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Issue UUID or friendly ID (e.g. PROJECT-123).
        required: true
      tags:
      - issues
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
      x-bugsink-required-capability: issues:read
    delete:
      operationId: issues_destroy
      description: |-
        Delete an issue.

        Required capability: `issues:delete`.
      summary: Delete an issue
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Issue UUID or friendly ID (e.g. PROJECT-123).
        required: true
      tags:
      - issues
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '204':
          description: No response body
      x-bugsink-required-capability: issues:delete
  /api/canonical/0/issues/{id}/event-counts/:
    get:
      operationId: issues_event_counts_retrieve
      description: |-
        Hourly counts by digest time, including evicted events. Empty hours have count zero. Defaults to 24 hours, including the incomplete current hour. Ranges must use UTC hour boundaries and fall within the last 90 days.

        Required capability: `issues:read`.
      summary: Retrieve issue event counts
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date-time
        description: Exclusive UTC hour boundary. Defaults to the end of the current
          hour.
      - in: path
        name: id
        schema:
          type: string
        description: Issue UUID or friendly ID (e.g. PROJECT-123).
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date-time
        description: Inclusive UTC hour boundary. Defaults to 24 hours before end.
      tags:
      - issues
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCounts'
          description: ''
      x-bugsink-required-capability: issues:read
  /api/canonical/0/issues/{id}/grouping/:
    get:
      operationId: issues_grouping_list
      description: |-
        List the grouping keys and mechanisms associated with this issue, ordered by ID.

        Required capability: `events:read`.
      summary: List issue grouping keys
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: id
        schema:
          type: string
        description: Issue UUID or friendly ID (e.g. PROJECT-123).
        required: true
      tags:
      - issues
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupingList'
          description: ''
      x-bugsink-required-capability: events:read
  /api/canonical/0/issues/{id}/mute/:
    post:
      operationId: issues_mute_create
      description: |-
        Mute this issue.

        Required capability: `issues:triage`.
      summary: Mute an issue
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Issue UUID or friendly ID (e.g. PROJECT-123).
        required: true
      tags:
      - issues
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
      x-bugsink-required-capability: issues:triage
  /api/canonical/0/issues/{id}/mute-for/:
    post:
      operationId: issues_mute_for_create
      description: |-
        Mute this issue for a relative period, e.g. for 3 days.

        Required capability: `issues:triage`.
      summary: Mute an issue for a period
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Issue UUID or friendly ID (e.g. PROJECT-123).
        required: true
      tags:
      - issues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueMuteFor'
        required: true
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
      x-bugsink-required-capability: issues:triage
  /api/canonical/0/issues/{id}/mute-until/:
    post:
      operationId: issues_mute_until_create
      description: |-
        Mute this issue until a threshold is reached, e.g. more than 10 events in 1 hour.

        Required capability: `issues:triage`.
      summary: Mute an issue until a threshold is reached
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Issue UUID or friendly ID (e.g. PROJECT-123).
        required: true
      tags:
      - issues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueMuteUntil'
        required: true
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
      x-bugsink-required-capability: issues:triage
  /api/canonical/0/issues/{id}/reopen/:
    post:
      operationId: issues_reopen_create
      description: |-
        Mark this resolved issue as unresolved again.

        Required capability: `issues:triage`.
      summary: Reopen an issue
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Issue UUID or friendly ID (e.g. PROJECT-123).
        required: true
      tags:
      - issues
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
      x-bugsink-required-capability: issues:triage
  /api/canonical/0/issues/{id}/resolve/:
    post:
      operationId: issues_resolve_create
      description: |-
        Mark this issue as resolved.

        Required capability: `issues:triage`.
      summary: Resolve an issue
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Issue UUID or friendly ID (e.g. PROJECT-123).
        required: true
      tags:
      - issues
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
      x-bugsink-required-capability: issues:triage
  /api/canonical/0/issues/{id}/resolve-latest/:
    post:
      operationId: issues_resolve_latest_create
      description: |-
        Mark this issue as resolved in the latest release.

        Required capability: `issues:triage`.
      summary: Resolve an issue in the latest release
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Issue UUID or friendly ID (e.g. PROJECT-123).
        required: true
      tags:
      - issues
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
      x-bugsink-required-capability: issues:triage
  /api/canonical/0/issues/{id}/resolve-next/:
    post:
      operationId: issues_resolve_next_create
      description: |-
        Mark this issue as resolved by the next release.

        Required capability: `issues:triage`.
      summary: Resolve an issue in the next release
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Issue UUID or friendly ID (e.g. PROJECT-123).
        required: true
      tags:
      - issues
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
      x-bugsink-required-capability: issues:triage
  /api/canonical/0/issues/{id}/tags/:
    get:
      operationId: issues_tags_list
      description: |-
        List stored tag values and their occurrence counts, ordered by ID. Counts are not reduced when event payloads are evicted. Includes values the UI groups under Other or hides as mostly unique.

        Required capability: `events:read`.
      summary: List issue tag values and counts
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: id
        schema:
          type: string
        description: Issue UUID or friendly ID (e.g. PROJECT-123).
        required: true
      - in: query
        name: key
        schema:
          type: string
        description: Filter by exact tag key.
      tags:
      - issues
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIssueTagList'
          description: ''
      x-bugsink-required-capability: events:read
  /api/canonical/0/issues/{id}/unmute/:
    post:
      operationId: issues_unmute_create
      description: |-
        Unmute this issue.

        Required capability: `issues:triage`.
      summary: Unmute an issue
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Issue UUID or friendly ID (e.g. PROJECT-123).
        required: true
      tags:
      - issues
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
      x-bugsink-required-capability: issues:triage
  /api/canonical/0/projects/:
    get:
      operationId: projects_list
      description: |-
        List projects ordered by name.

        Required capability: `projects:read`.
      summary: List projects
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: team
        schema:
          type: string
          format: uuid
        description: Optional filter by team UUID.
      tags:
      - projects
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectListList'
          description: ''
      x-bugsink-required-capability: projects:read
    post:
      operationId: projects_create
      description: |-
        Create a project. `team` is the team UUID. `visibility` and alert settings are optional.

        Required capability: `projects:manage`.
      summary: Create a project
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreate'
          description: ''
      x-bugsink-required-capability: projects:manage
  /api/canonical/0/projects/{id}/:
    get:
      operationId: projects_retrieve
      description: |-
        Retrieve a project by integer project ID. Use `expand=team` to include the team object.

        Required capability: `projects:read`.
      summary: Retrieve a project
      parameters:
      - in: query
        name: expand
        schema:
          type: string
          enum:
          - team
        description: Optional related object expansion.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - projects
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
      x-bugsink-required-capability: projects:read
    patch:
      operationId: projects_partial_update
      description: |-
        Partially update a project by integer project ID.

        Required capability: `projects:manage`.
      summary: Update a project
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectUpdate'
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUpdate'
          description: ''
      x-bugsink-required-capability: projects:manage
  /api/canonical/0/projects/{id}/event-counts/:
    get:
      operationId: projects_event_counts_retrieve
      description: |-
        Hourly counts by digest time, including evicted events. Empty hours have count zero. Defaults to 24 hours, including the incomplete current hour. Ranges must use UTC hour boundaries and fall within the last 90 days.

        Required capability: `projects:read`.
      summary: Retrieve project event counts
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date-time
        description: Exclusive UTC hour boundary. Defaults to the end of the current
          hour.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date-time
        description: Inclusive UTC hour boundary. Defaults to 24 hours before end.
      tags:
      - projects
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCounts'
          description: ''
      x-bugsink-required-capability: projects:read
  /api/canonical/0/releases/:
    get:
      operationId: releases_list
      description: |-
        List releases for a project. Pass the integer project ID in the required `project` query parameter.

        Required capability: `releases:read`.
      summary: List releases
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: project
        schema:
          type: integer
        description: Filter releases by project id (required).
        required: true
      tags:
      - releases
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReleaseListList'
          description: ''
      x-bugsink-required-capability: releases:read
    post:
      operationId: releases_create
      description: |-
        Create a release for a project. `project` is the integer project ID. `version` is the release version string.

        Required capability: `releases:create`.
      summary: Create a release
      tags:
      - releases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseCreate'
            examples:
              CreateRelease:
                value:
                  project: 1
                  version: my-package@1.2.3
                summary: Create release
        required: true
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDetail'
          description: ''
      x-bugsink-required-capability: releases:create
  /api/canonical/0/releases/{id}/:
    get:
      operationId: releases_retrieve
      description: |-
        Retrieve a release by release UUID.

        Required capability: `releases:read`.
      summary: Retrieve a release
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this release.
        required: true
      tags:
      - releases
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDetail'
          description: ''
      x-bugsink-required-capability: releases:read
  /api/canonical/0/teams/:
    get:
      operationId: teams_list
      description: |-
        List teams ordered by name.

        Required capability: `teams:read`.
      summary: List teams
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      tags:
      - teams
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeamListList'
          description: ''
      x-bugsink-required-capability: teams:read
    post:
      operationId: teams_create
      description: |-
        Create a team. `visibility` is optional and defaults to `discoverable`.

        Required capability: `teams:manage`.
      summary: Create a team
      tags:
      - teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateUpdate'
        required: true
      security:
      - BearerAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCreateUpdate'
