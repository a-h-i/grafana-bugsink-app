                    type: integer
                  maxFileSize:
                    type: integer
                  concurrency:
                    type: integer
                  chunksPerRequest:
                    type: integer
                  hashAlgorithm:
                    type: string
                  compression:
                    type: array
                    items:
                      type: string
                  accept:
                    type: array
                    items:
                      type: string
                required:
                - url
                - chunkSize
                - maxRequestSize
                - maxFileSize
                - concurrency
                - chunksPerRequest
                - hashAlgorithm
                - compression
                - accept
        '401':
          description: Authorization token is missing or invalid.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  message:
                    type: string
                  detail:
                    type: string
                  error:
                    type: string
    post:
      operationId: sentry_compatible_chunk_upload_create
