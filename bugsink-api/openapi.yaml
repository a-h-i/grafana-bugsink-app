components:
  schemas:
    EventCountBucket:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        count:
          type: integer
      required:
      - count
      - timestamp
    EventCounts:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        interval_seconds:
          type: integer
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/EventCountBucket'
      required:
      - buckets
      - end
      - interval_seconds
      - start
    EventDetail:
      type: object
      description: 'Detail view: includes full `data` payload.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Bugsink-internal
        ingested_at:
          type: string
          format: date-time
        digested_at:
          type: string
          format: date-time
        issue:
          type: string
          format: uuid
        grouping:
          type: integer
        event_id:
          type: string
          format: uuid
          readOnly: true
          description: As per the sent data
        project:
          type: integer
        timestamp:
          type: string
          format: date-time
        digest_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        data:
          readOnly: true
        stacktrace_md:
          type: string
          readOnly: true
      required:
      - data
      - digest_order
      - digested_at
      - event_id
      - grouping
      - id
      - ingested_at
      - issue
      - project
      - stacktrace_md
      - timestamp
    EventList:
      type: object
      description: 'Lightweight list view: excludes the (potentially large) `data`
        field.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Bugsink-internal
        ingested_at:
          type: string
          format: date-time
        digested_at:
          type: string
          format: date-time
        issue:
          type: string
          format: uuid
        grouping:
          type: integer
        event_id:
          type: string
          format: uuid
          readOnly: true
          description: As per the sent data
        project:
          type: integer
        timestamp:
          type: string
          format: date-time
        digest_order:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - digest_order
      - digested_at
      - event_id
      - grouping
      - id
      - ingested_at
      - issue
      - project
      - timestamp
    Grouping:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        grouping_key:
          type: string
          readOnly: true
        grouping_mechanism:
          allOf:
          - $ref: '#/components/schemas/GroupingKeyMechanismEnum'
          readOnly: true
      required:
      - grouping_key
      - grouping_mechanism
      - id
    GroupingKeyMechanismEnum:
      enum:
      - none
      - bugsink-v1
      - bugsink-v2
      type: string
      description: |-
        * `none` - Mechanism-independent (explicit fingerprint)
        * `bugsink-v1` - Original, default until v2.4.0 (July 2026)
        * `bugsink-v2` - Value-normalized (latest)
    GroupingMechanismEnum:
      enum:
      - bugsink-v1
      - bugsink-v2
      type: string
      description: |-
        * `bugsink-v1` - Original, default until v2.4.0 (July 2026)
        * `bugsink-v2` - Value-normalized (latest)
    Issue:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        friendly_id:
          type: string
          readOnly: true
        project:
          type: integer
        digest_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        last_seen:
          type: string
          format: date-time
        first_seen:
          type: string
          format: date-time
        digested_event_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        stored_event_count:
          type: integer
          readOnly: true
        calculated_type:
          type: string
          maxLength: 128
        calculated_value:
          type: string
          maxLength: 1024
        transaction:
          type: string
          maxLength: 200
        is_resolved:
          type: boolean
        is_resolved_unconditionally:
          type: boolean
        is_resolved_by_next_release:
          type: boolean
        fixed_at:
          type: array
          items:
            type: string
          readOnly: true
          description: Release versions at which this issue was marked fixed.
        events_at:
          type: array
          items:
            type: string
          readOnly: true
          description: Release versions in which events were seen. An empty string
            means no release was supplied.
        is_muted:
          type: boolean
        unmute_after:
          type: string
          format: date-time
          nullable: true
        unmute_on_volume_based_conditions:
          type: array
          items:
            $ref: '#/components/schemas/UnmuteVolumeCondition'
          readOnly: true
          description: 'Unmute when any condition is met: at least volume events within
            nr_of_periods of period.'
      required:
      - digest_order
      - digested_event_count
      - events_at
      - first_seen
      - fixed_at
      - friendly_id
      - id
      - last_seen
      - project
      - stored_event_count
      - unmute_on_volume_based_conditions
    IssueComment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        issue:
          type: string
        project:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        comment:
          type: string
        user:
          type: integer
          readOnly: true
          nullable: true
      required:
      - comment
      - id
      - issue
      - project
      - timestamp
      - user
    IssueMuteFor:
      type: object
      properties:
        period_name:
          $ref: '#/components/schemas/PeriodNameEnum'
        nr_of_periods:
          type: integer
          minimum: 1
      required:
      - nr_of_periods
      - period_name
    IssueMuteUntil:
      type: object
      properties:
        period_name:
          $ref: '#/components/schemas/PeriodNameEnum'
        nr_of_periods:
          type: integer
          minimum: 1
        gte_threshold:
          type: integer
          minimum: 1
      required:
      - gte_threshold
      - nr_of_periods
      - period_name
    IssueTag:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          readOnly: true
        value:
          type: string
          readOnly: true
        count:
          type: integer
          readOnly: true
      required:
      - count
      - id
      - key
      - value
    KindEnum:
      enum:
      - first_seen
      - resolved
      - muted
      - regressed
      - unmuted
      - reopened
      - next_materialized
      - manual_annotation
      type: string
      description: |-
        * `first_seen` - first_seen
        * `resolved` - resolved
        * `muted` - muted
        * `regressed` - regressed
