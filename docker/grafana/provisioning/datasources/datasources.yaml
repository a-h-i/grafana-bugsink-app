apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
  - name: Bugsink
    type: ahmedismail-bugsink-datasource
    uid: bugsink
    isDefault: true
    access: proxy
    url: http://bugsink:8000
    jsonData:
      browserUrl: http://localhost:8800
      tempoDatasourceUid: tempo
      lokiDatasourceUid: loki
    secureJsonData:
      # Public development-only token from docker/bugsink/seed.py.
      apiToken: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  - name: Bugsink project-bound
    type: ahmedismail-bugsink-datasource
    uid: bugsink-project
    access: proxy
    url: http://bugsink:8000
    jsonData:
      browserUrl: http://localhost:8800
    secureJsonData:
      # Public development-only token from docker/bugsink/seed.py, bound to project 1.
      apiToken: cccccccccccccccccccccccccccccccccccccccc
  - name: Bugsink triage
    type: ahmedismail-bugsink-datasource
    uid: bugsink-triage
    access: proxy
    url: http://bugsink:8000
    jsonData:
      browserUrl: http://localhost:8800
      triageEnabled: true
    secureJsonData:
      # Public development-only token from docker/bugsink/seed.py, with issues:triage.
      apiToken: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
