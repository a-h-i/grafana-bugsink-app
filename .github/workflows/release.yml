# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # Signs the build when the repository has the token; the root URLs make it a private signature.
      - uses: grafana/plugin-actions/build-plugin@2d94bed3b0179ab5fc010e1a06e210a9c34b27ca # main
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          sign_root_urls: ${{ vars.SIGN_ROOT_URLS }}
          node-version: '24'
          go-version: '1.26'
          attestation: true
