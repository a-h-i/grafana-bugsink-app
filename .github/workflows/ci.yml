# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet backend
        run: go vet ./pkg/...

      - name: Lint backend
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: ./pkg/...

      - name: Test backend
        run: go test ./pkg/...

      - name: Check the generated client is current
        run: |
          go generate ./pkg/bugsink/...
          if [ -n "$(git status --porcelain pkg/bugsink)" ]; then
            git status --porcelain pkg/bugsink
            git diff pkg/bugsink
            exit 1
          fi

      - name: Check SPDX headers
        run: scripts/check_spdx.sh

      - name: Check dependency licences
        run: scripts/check_licenses.sh

  e2e:
    name: End-to-end tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: npm run build:backend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Verify the stack
        run: python3 scripts/verify_stack.py

      - name: Run Playwright tests
        run: npm run e2e
        env:
          GRAFANA_URL: http://localhost:3300

      - name: Docker logs
        if: failure()
        run: docker compose logs grafana bugsink

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
